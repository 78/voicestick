name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.pages-artifact.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Update appcast from the latest macOS and Windows releases
        run: |
          set -euo pipefail
          curl -fsSL "https://78.github.io/voicestick/appcast.xml" \
            -o website/public/appcast.xml || true
          releases="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -c '
            def asset($name): first(.assets[] | select(.name == $name and .size > 0)) // null;
            add
            | map(select((.draft or .prerelease) | not)
                | select(.tag_name | test("^((macos|windows)-)?v[0-9]+[.][0-9]+[.][0-9]+$")))
            | map((.tag_name | sub("^((macos|windows)-)?v"; "")) as $version | {
                tag: .tag_name, version: $version, notes: (.body // ""),
                dmg: asset("VoiceStick-" + $version + ".dmg"),
                zip: asset("VoiceStick-" + $version + ".zip"),
                signature: asset("VoiceStick-" + $version + ".signature"),
                msi: asset("VoiceStick_" + $version + ".msi")
              })
            | sort_by(.version | split(".") | map(tonumber)) | reverse
            | {
                mac: (first(.[] | select((.tag | test("^(macos-)?v")) and .dmg and .zip and .signature)) // null),
                windows: (first(.[] | select(.msi)) // null)
              }
          ')"
          mac_tag="$(jq -er '.mac.tag' <<< "$releases")"
          version="$(jq -er '.mac.version' <<< "$releases")"
          sig_asset="$(jq -er '.mac.signature.name' <<< "$releases")"
          gh release download "$mac_tag" --pattern "$sig_asset" --dir "$RUNNER_TEMP"
          signature="$(cat "$RUNNER_TEMP/$sig_asset" | tr -d '\n')"
          args=(
            --version "$version"
            --zip-url "$(jq -er '.mac.zip.browser_download_url' <<< "$releases")"
            --signature "$signature"
            --length "$(jq -er '.mac.zip.size' <<< "$releases")"
            --release-notes "$(jq -r '.mac.notes' <<< "$releases")"
          )
          if jq -e '.windows' <<< "$releases" > /dev/null; then
            args+=(
              --msi-version "$(jq -er '.windows.version' <<< "$releases")"
              --msi-url "$(jq -er '.windows.msi.browser_download_url' <<< "$releases")"
              --msi-length "$(jq -er '.windows.msi.size' <<< "$releases")"
              --msi-release-notes "$(jq -r '.windows.notes' <<< "$releases")"
            )
          fi
          python3 scripts/update-appcast.py "${args[@]}"
          echo "VITE_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "VITE_MAC_DOWNLOAD_URL=$(jq -er '.mac.dmg.browser_download_url' <<< "$releases")" >> "$GITHUB_ENV"
          python3 - <<'PYTHON' >> "$GITHUB_ENV"
          import xml.etree.ElementTree as ET
          feed = ET.parse("website/public/appcast.xml")
          sparkle = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          windows = feed.find(".//enclosure[@sparkle:os='windows']", {"sparkle": sparkle})
          if windows is not None:
              print("VITE_WINDOWS_DOWNLOAD_URL=" + windows.attrib["url"])
              print("VITE_WINDOWS_RELEASE_VERSION=" + windows.attrib[f"{{{sparkle}}}shortVersionString"])
          PYTHON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy firmware manifests for GitHub Pages
        env:
          ALIYUN_OSS_PUBLIC_BASE_URL: ${{ vars.ALIYUN_OSS_PUBLIC_BASE_URL }}
          ALIYUN_OSS_PREFIX: ${{ vars.ALIYUN_OSS_PREFIX }}
        run: |
          set -euo pipefail
          base="${ALIYUN_OSS_PUBLIC_BASE_URL:-https://xiaozhi-voice-assistant.oss-cn-shenzhen.aliyuncs.com}"
          prefix="${ALIYUN_OSS_PREFIX:-voicestick/firmwares}"
          prefix="${prefix#/}"
          source="${base%/}/${prefix%/}"
          for hardware in stick_s3 voicestick_c3 magiclick_2p5; do
            oss_subdir="/$hardware"
            pages_board="$hardware"
            if [[ "$hardware" == stick_s3 ]]; then
              oss_subdir=""
              pages_board="m5stack_stick_s3"
            fi
            target="website/public/firmwares/$pages_board/latest"
            mkdir -p "$target"
            curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' \
              "$source$oss_subdir/latest/manifest.json" -o "$target/manifest.json"
            jq -e --arg hardware "$hardware" '.hardware == $hardware and (.version | type == "string")' \
              "$target/manifest.json" > /dev/null
          done

      - name: Build website
        run: npm run build
        working-directory: website
        env:
          VITE_FIRMWARE_MANIFEST_URL: ./firmwares/m5stack_stick_s3/latest/manifest.json
          VITE_C3_FIRMWARE_MANIFEST_URL: ./firmwares/voicestick_c3/latest/manifest.json
          VITE_MAGICLICK_FIRMWARE_MANIFEST_URL: ./firmwares/magiclick_2p5/latest/manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        id: pages-artifact
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          set -euo pipefail
          : "${ARTIFACT_ID:?Missing Pages artifact ID}"
          for attempt in {1..10}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              | jq -e --argjson id "$ARTIFACT_ID" 'any(.artifacts[]; .id == $id and (.expired | not))' > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo '::error::The uploaded github-pages artifact did not become visible.'
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
