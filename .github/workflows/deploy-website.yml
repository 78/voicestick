name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Update appcast from the latest macOS and Windows releases
        run: |
          set -euo pipefail
          curl -fsSL "https://78.github.io/voicestick/appcast.xml" \
            -o website/public/appcast.xml || true
          releases="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -c '
            def asset($name): first(.assets[] | select(.name == $name and .size > 0)) // null;
            add
            | map(select((.draft or .prerelease) | not)
                | select(.tag_name | test("^(windows-)?v[0-9]+[.][0-9]+[.][0-9]+$")))
            | map((.tag_name | sub("^(windows-)?v"; "")) as $version | {
                tag: .tag_name, version: $version, notes: (.body // ""),
                zip: asset("VoiceStick-" + $version + ".zip"),
                signature: asset("VoiceStick-" + $version + ".signature"),
                msi: asset("VoiceStick_" + $version + ".msi")
              })
            | sort_by(.version | split(".") | map(tonumber)) | reverse
            | {
                mac: (first(.[] | select((.tag | startswith("v")) and .zip and .signature)) // null),
                windows: (first(.[] | select(.msi)) // null)
              }
          ')"
          mac_tag="$(jq -er '.mac.tag' <<< "$releases")"
          version="$(jq -er '.mac.version' <<< "$releases")"
          sig_asset="$(jq -er '.mac.signature.name' <<< "$releases")"
          gh release download "$mac_tag" --pattern "$sig_asset" --dir "$RUNNER_TEMP"
          signature="$(cat "$RUNNER_TEMP/$sig_asset" | tr -d '\n')"
          args=(
            --version "$version"
            --zip-url "$(jq -er '.mac.zip.browser_download_url' <<< "$releases")"
            --signature "$signature"
            --length "$(jq -er '.mac.zip.size' <<< "$releases")"
            --release-notes "$(jq -r '.mac.notes' <<< "$releases")"
          )
          if jq -e '.windows' <<< "$releases" > /dev/null; then
            args+=(
              --msi-version "$(jq -er '.windows.version' <<< "$releases")"
              --msi-url "$(jq -er '.windows.msi.browser_download_url' <<< "$releases")"
              --msi-length "$(jq -er '.windows.msi.size' <<< "$releases")"
              --msi-release-notes "$(jq -r '.windows.notes' <<< "$releases")"
            )
          fi
          python3 scripts/update-appcast.py "${args[@]}"
          echo "VITE_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          python3 - <<'PYTHON' >> "$GITHUB_ENV"
          import xml.etree.ElementTree as ET
          feed = ET.parse("website/public/appcast.xml")
          windows = feed.find(".//enclosure[@sparkle:os='windows']", {"sparkle": "http://www.andymatuschak.org/xml-namespaces/sparkle"})
          if windows is not None:
              print("VITE_WINDOWS_DOWNLOAD_URL=" + windows.attrib["url"])
          PYTHON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy firmware manifests for GitHub Pages
        env:
          ALIYUN_OSS_PUBLIC_BASE_URL: ${{ vars.ALIYUN_OSS_PUBLIC_BASE_URL }}
          ALIYUN_OSS_PREFIX: ${{ vars.ALIYUN_OSS_PREFIX }}
        run: |
          set -euo pipefail
          base="${ALIYUN_OSS_PUBLIC_BASE_URL:-https://xiaozhi-voice-assistant.oss-cn-shenzhen.aliyuncs.com}"
          prefix="${ALIYUN_OSS_PREFIX:-voicestick/firmwares}"
          prefix="${prefix#/}"
          source="${base%/}/${prefix%/}"
          for hardware in stick_s3 voicestick_c3; do
            oss_subdir="/$hardware"
            pages_board="$hardware"
            if [[ "$hardware" == stick_s3 ]]; then
              oss_subdir=""
              pages_board="m5stack_stick_s3"
            fi
            target="website/public/firmwares/$pages_board/latest"
            mkdir -p "$target"
            curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' \
              "$source$oss_subdir/latest/manifest.json" -o "$target/manifest.json"
            jq -e --arg hardware "$hardware" '.hardware == $hardware and (.version | type == "string")' \
              "$target/manifest.json" > /dev/null
          done

      - name: Build website
        run: npm run build
        working-directory: website
        env:
          VITE_FIRMWARE_MANIFEST_URL: ./firmwares/m5stack_stick_s3/latest/manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
