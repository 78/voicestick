asr_provider = "voicestick_cloud"
voicestick_api_key = ""
voicestick_cloud_url = "wss://api.xiaozhi.me/voicestick/asr/"
# With asr_provider = "openai", this key covers transcription, polishing, and translation.
openai_api_key = ""
interaction_mode = "hold_to_talk"
asr_hotwords = "小智,VoiceStick"
paired_device_ids = ""
device_theme_colors = ""
device_overlay_positions = ""
auto_enter = true
debug_audio_cache = false
# debug_audio_dir = "~/Library/Application Support/VoiceStick/DebugAudio"

[output]
target = "focused_app"
transform = "original" # original, polish, or translate
translation_target = "en"

# Optional per-device output overrides:
# [device.C3D8.output]
# transform = "translate"
# translation_target = "en"
#
# [device."09AF".output]
# transform = "translate"
# translation_target = "zh-Hans"
